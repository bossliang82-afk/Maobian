<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛边 Deckle Edge - Edition 7</title>
    <style>
        :root {
            /* 纸质与大地自然色调 */
            --paper-bg: #F7F5F0;
            --paper-card: #FFFFFF;
            --ink-strong: #2D2C2A;
            --ink-medium: #54524F;
            --ink-muted: #8E8B84;
            --ink-faint: #C8C5BE;
            --accent-warm: #E2DBD0;
            --accent-glow: rgba(226, 219, 208, 0.45);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            /* 模拟真实桌面工作台背景 */
            background: transparent !important;
            color: var(--ink-strong);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        
        /* 桌面透明与可拖拽配置 */
        html, body {
            background: transparent !important;
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .desktop-widget {
            position: relative;
            width: 326px;
            /* 允许按住主体拖拽移动窗口 */
            -webkit-app-region: drag;
        }

        /* 所有可点击与输入的交互元素必须禁止拖动事件冒泡，保证正常点击/输入 */
        button, input, textarea, .sticker-chip, .info-bubble, .pet-stage, .refresh-pill, a {
            -webkit-app-region: no-drag;
        }

        /* 顶部极其克制的小组件辅助关闭/最小化微标 */
        .widget-win-controls {
            position: absolute;
            top: 6px;
            right: 12px;
            display: flex;
            gap: 6px;
            z-index: 60;
            opacity: 0;
            transition: opacity 0.2s ease;
            -webkit-app-region: no-drag;
        }
        .desktop-widget:hover .widget-win-controls {
            opacity: 1;
        }
        .win-ctrl-btn {
            background: rgba(220, 215, 205, 0.6);
            border: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 9px;
            line-height: 15px;
            text-align: center;
            color: #54524F;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .win-ctrl-btn:hover {
            background: #2D2C2A;
            color: #FFFFFF;
        }
        /* 开机自启图标专属样式 */
        .win-ctrl-autostart {
            background: rgba(220, 215, 205, 0.7);
            color: #54524F;
        }
        .win-ctrl-autostart.active {
            background: #2D2C2A;
            color: #F7F5F0;
        }
        .win-ctrl-autostart svg {
            width: 9px;
            height: 9px;
            fill: currentColor;
        }
        /* 桌面组件主体容器：带拖拽光标指示与高级微物理投影 */
        .desktop-widget {
            position: relative;
            width: 326px;
            /* 模拟桌面可随意摆放的光标体验 */
            cursor: default;
            filter: drop-shadow(0 16px 36px rgba(45, 40, 30, 0.12)) drop-shadow(0 3px 8px rgba(45, 40, 30, 0.05));
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        /* 桌宠：探头扒在纸缘的小猫咪 (细节立体重绘) */
        .pet-stage {
            position: absolute;
            top: -48px;
            right: 36px;
            width: 84px;
            height: 64px;
            z-index: 35;
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .pet-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* 灵动怠速动画 */
        @keyframes pet-idle-breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(1.8px); }
        }
        @keyframes pet-tail-flick {
            0%, 75%, 100% { transform: rotate(0deg); }
            82% { transform: rotate(-18deg); }
            90% { transform: rotate(6deg); }
        }
        @keyframes pet-ear-twitch {
            0%, 82%, 100% { transform: rotate(0deg); }
            88% { transform: rotate(-9deg); }
            94% { transform: rotate(3deg); }
        }
        @keyframes pet-blink-natural {
            0%, 93%, 97%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.08); }
        }

        .pet-body-group {
            animation: pet-idle-breathe 4s ease-in-out infinite;
            transform-origin: center bottom;
        }
        .pet-tail {
            transform-origin: 19px 42px;
            animation: pet-tail-flick 4.8s ease-in-out infinite;
        }
        .pet-left-ear {
            transform-origin: 30px 32px;
            animation: pet-ear-twitch 5.6s ease-in-out infinite;
        }
        .pet-eyes-open {
            transform-origin: 52px 38px;
            animation: pet-blink-natural 4s infinite;
        }

        
        /* 桌宠说话气泡 */
        .pet-speech-bubble {
            position: absolute;
            top: -34px;
            right: 0px;
            background: #FFFFFF;
            border: 1px solid rgba(142, 139, 132, 0.35);
            padding: 5px 10px;
            border-radius: 12px 12px 2px 12px;
            font-size: 11px;
            font-weight: 500;
            color: var(--ink-strong);
            white-space: nowrap;
            box-shadow: 0 4px 14px rgba(45, 40, 30, 0.08);
            pointer-events: none;
            opacity: 0;
            transform: translateY(6px) scale(0.9);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 50;
        }
        .pet-speech-bubble.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        /* 强互动弹跳与炸毛 */
        .anim-pop {
            animation: pet-pop-feedback 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }
        @keyframes pet-pop-feedback {
            0% { transform: translateY(0) scale(1); }
            35% { transform: translateY(-7px) scale(1.12, 0.9); }
            70% { transform: translateY(2px) scale(0.95, 1.06); }
            100% { transform: translateY(0) scale(1); }
        }

        .anim-angry-shake {
            animation: pet-angry-vibe 0.12s ease-in-out infinite !important;
        }
        @keyframes pet-angry-vibe {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-2px, 1px); }
            75% { transform: translate(2px, -1px); }
        }

        /* 毛边手作纸张主体 */
        .maobian-sheet {
            background-color: var(--paper-bg);
            /* 细微的手工边缘不规则弧度感 */
            border-radius: 20px 22px 18px 24px;
            padding: 24px 22px 20px 22px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.85);
            /* 手工纸张微噪点质感 */
            background-image: 
                radial-gradient(rgba(0,0,0,0.015) 1px, transparent 0),
                linear-gradient(to bottom, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.1) 100%);
            background-size: 8px 8px, 100% 100%;
            transition: opacity 0.8s ease, transform 0.8s ease;
            z-index: 5;
        }

        /* 顶部毛边顶标与折角胶带条 */
        .tape-strip {
            position: absolute;
            top: -10px;
            left: 36px;
            width: 72px;
            height: 22px;
            background: rgba(235, 230, 220, 0.65);
            backdrop-filter: blur(2px);
            border-left: 2px dashed rgba(200, 190, 175, 0.5);
            border-right: 2px dashed rgba(200, 190, 175, 0.5);
            transform: rotate(-3deg);
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            pointer-events: none;
        }

        /* 顶部元信息栏：日期 + 留白标识 */
        .top-meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--accent-warm);
        }

        .meta-date {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--ink-muted);
        }

        .meta-mark {
            font-size: 11px;
            letter-spacing: 0.8px;
            color: var(--ink-faint);
            font-style: italic;
        }

        /* 提问卡片区域 */
        .question-card {
            margin-bottom: 18px;
        }

        .question-text {
            font-size: 14.5px;
            line-height: 1.6;
            color: var(--ink-strong);
            font-weight: 500;
            letter-spacing: 0.2px;
            min-height: 46px;
            margin-bottom: 8px;
        }

        .refresh-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11.5px;
            color: var(--ink-muted);
            cursor: pointer;
            padding: 3px 8px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.025);
            transition: all 0.2s ease;
        }
        .refresh-pill:hover {
            color: var(--ink-strong);
            background: var(--accent-warm);
        }
        .refresh-pill svg {
            width: 11px;
            height: 11px;
            fill: currentColor;
            transition: transform 0.4s ease;
        }
        .refresh-pill:hover svg {
            transform: rotate(180deg);
        }

        /* 玻璃质感微立体输入框 */
        .input-pocket {
            position: relative;
            background: var(--paper-card);
            border-radius: 14px;
            padding: 12px 14px 24px 14px;
            margin-bottom: 22px;
            border: 1px solid rgba(220, 214, 202, 0.7);
            box-shadow: 
                inset 0 1px 3px rgba(0, 0, 0, 0.03),
                0 4px 12px rgba(60, 50, 40, 0.03);
            transition: all 0.25s ease;
        }
        .input-pocket:focus-within {
            border-color: rgba(160, 150, 135, 0.9);
            box-shadow: 
                inset 0 1px 2px rgba(0, 0, 0, 0.02),
                0 6px 18px rgba(60, 50, 40, 0.06);
            transform: translateY(-1px);
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            padding: 0;
            font-size: 14px;
            line-height: 1.6;
            color: var(--ink-strong);
            outline: none;
            resize: none;
            overflow: hidden;
            font-family: inherit;
            min-height: 24px;
            user-select: text;
        }
        textarea::placeholder {
            color: var(--ink-faint);
            font-weight: 300;
        }

        .counter-badge {
            position: absolute;
            right: 12px;
            bottom: 6px;
            font-size: 10.5px;
            color: var(--ink-muted);
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        /* 情绪贴纸展架 */
        .stickers-section {
            margin-bottom: 24px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--ink-medium);
        }

        /* 优雅的贴纸网格 */
        .stickers-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .sticker-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 4px 6px 4px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(225, 220, 210, 0.6);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .sticker-chip:hover {
            background: #FFFFFF;
            border-color: rgba(200, 190, 175, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
        }

        /* 选中高亮状态：清淡而明确的自然色 */
        .sticker-chip.selected {
            background: #FFFFFF !important;
            border-color: #8E8B84 !important;
            box-shadow: 0 4px 12px rgba(45, 40, 30, 0.09) !important;
            transform: translateY(-2px) scale(1.04) !important;
        }

        .chip-emoji {
            font-size: 21px;
            line-height: 1;
            margin-bottom: 4px;
            transition: transform 0.2s ease;
        }
        .sticker-chip.selected .chip-emoji {
            transform: scale(1.15);
        }

        .chip-text {
            font-size: 10.5px;
            color: var(--ink-medium);
            letter-spacing: 0.3px;
        }
        .sticker-chip.selected .chip-text {
            color: var(--ink-strong);
            font-weight: 600;
        }

        /* 底部操作工具栏 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 6px;
        }

        .tool-left {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-export-link {
            background: transparent;
            border: none;
            font-size: 12.5px;
            color: var(--ink-muted);
            cursor: pointer;
            letter-spacing: 0.4px;
            transition: color 0.2s ease;
        }
        .btn-export-link:hover {
            color: var(--ink-strong);
            text-decoration: underline;
        }

        .info-bubble {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid var(--ink-faint);
            color: var(--ink-muted);
            font-size: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: help;
            position: relative;
        }
        .info-bubble:hover {
            border-color: var(--ink-medium);
            color: var(--ink-strong);
        }

        .popover-card {
            visibility: hidden;
            width: 215px;
            background: rgba(45, 44, 42, 0.96);
            backdrop-filter: blur(8px);
            color: #F7F5F0;
            border-radius: 8px;
            padding: 9px 12px;
            position: absolute;
            z-index: 100;
            bottom: 135%;
            left: -12px;
            font-size: 11px;
            line-height: 1.5;
            opacity: 0;
            transform: translateY(4px);
            transition: all 0.25s ease;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
        }
        .popover-card::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 17px;
            margin-left: -4px;
            border-width: 4px;
            border-style: solid;
            border-color: rgba(45, 44, 42, 0.96) transparent transparent transparent;
        }
        .info-bubble:hover .popover-card {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
        }

        /* 封存按钮：带蜡封印章仪式感的高级按钮 */
        .btn-seal-stamp {
            background: var(--ink-strong);
            color: #FAF9F6;
            border: none;
            border-radius: 20px;
            padding: 7px 18px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.8px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(45, 44, 42, 0.15);
            transition: all 0.22s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-seal-stamp:hover {
            background: #1A1918;
            transform: translateY(-1.5px);
            box-shadow: 0 6px 16px rgba(45, 44, 42, 0.22);
        }
        .btn-seal-stamp:active {
            transform: translateY(0.5px);
        }

        /* 二次确认印章盖下遮罩 */
        .stamp-dialog-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(247, 245, 240, 0.96);
            backdrop-filter: blur(5px);
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 50;
        }
        .stamp-dialog-mask.active {
            opacity: 1;
            pointer-events: auto;
        }

        .stamp-dialog-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--ink-strong);
            margin-bottom: 6px;
        }
        .stamp-dialog-subtitle {
            font-size: 11.5px;
            color: var(--ink-muted);
            margin-bottom: 22px;
        }

        .dialog-btns {
            display: flex;
            gap: 14px;
        }
        .btn-dialog-cancel {
            background: transparent;
            border: 1px solid var(--accent-warm);
            color: var(--ink-medium);
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 12.5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-dialog-cancel:hover {
            background: rgba(0,0,0,0.03);
            border-color: var(--ink-muted);
        }
        .btn-dialog-confirm {
            background: var(--ink-strong);
            border: none;
            color: #FAF9F6;
            padding: 6px 18px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
            transition: all 0.2s;
        }
        .btn-dialog-confirm:hover {
            background: #111;
        }

        /* 消失淡出动画 */
        
        /* 封存成功的温情告别卡片 */
        .sealed-curtain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(247, 245, 240, 0.96);
            backdrop-filter: blur(8px);
            border-radius: 20px 22px 18px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            z-index: 45;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.96);
            transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sealed-curtain.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }
        .sealed-icon {
            font-size: 26px;
            margin-bottom: 12px;
            animation: pet-idle-breathe 2.4s ease-in-out infinite;
        }
        .sealed-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink-strong);
            margin-bottom: 6px;
            letter-spacing: 0.4px;
        }
        .sealed-sub {
            font-size: 12px;
            color: var(--ink-muted);
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .sealed-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        .btn-curtain-stay {
            background: #FFFFFF;
            border: 1px solid var(--accent-warm);
            padding: 6px 16px;
            border-radius: 14px;
            font-size: 12px;
            color: var(--ink-medium);
            cursor: pointer;
            transition: all 0.18s ease;
        }
        .btn-curtain-stay:hover {
            background: var(--paper-bg);
            border-color: var(--ink-muted);
            color: var(--ink-strong);
        }
        .btn-curtain-bye {
            background: var(--ink-strong);
            border: 1px solid var(--ink-strong);
            padding: 6px 16px;
            border-radius: 14px;
            font-size: 12px;
            color: #FFFFFF;
            cursor: pointer;
            transition: all 0.18s ease;
        }
        .btn-curtain-bye:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }

        /* 导出日期选择弹窗 */
        .export-modal-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(247, 245, 240, 0.95);
            backdrop-filter: blur(6px);
            border-radius: 20px 22px 18px 24px;
            display: flex;
            flex-direction: column;
            padding: 20px 18px;
            z-index: 46;
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
            transition: all 0.3s ease;
        }
        .export-modal-mask.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .export-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--accent-warm);
        }
        .export-head-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-strong);
        }
        .export-close {
            background: none;
            border: none;
            font-size: 16px;
            color: var(--ink-muted);
            cursor: pointer;
            padding: 0 4px;
        }
        .export-filter-pills {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .filter-pill {
            flex: 1;
            padding: 5px 0;
            font-size: 11px;
            text-align: center;
            background: #FFFFFF;
            border: 1px solid var(--accent-warm);
            border-radius: 6px;
            color: var(--ink-medium);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .filter-pill.active {
            background: var(--ink-strong);
            color: #FFFFFF;
            border-color: var(--ink-strong);
            font-weight: 500;
        }
        .export-custom-range {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            font-size: 11px;
            color: var(--ink-muted);
        }
        .date-input {
            width: 108px;
            padding: 4px 6px;
            font-size: 11px;
            font-family: inherit;
            border: 1px solid var(--accent-warm);
            border-radius: 6px;
            background: #FFFFFF;
            color: var(--ink-strong);
            outline: none;
        }
        .date-input:focus {
            border-color: var(--ink-medium);
        }
        .export-record-preview {
            flex: 1;
            overflow-y: auto;
            background: #FFFFFF;
            border: 1px solid rgba(226, 219, 208, 0.6);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 12px;
            font-size: 11px;
            line-height: 1.5;
            color: var(--ink-medium);
        }
        .preview-item {
            padding: 5px 0;
            border-bottom: 1px dashed #F0EDE6;
        }
        .preview-item:last-child {
            border-bottom: none;
        }
        .export-actions {
            display: flex;
            gap: 8px;
        }
        .btn-action-primary {
            flex: 1;
            background: var(--ink-strong);
            color: #FFFFFF;
            border: none;
            padding: 8px 0;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-action-primary:hover {
            opacity: 0.9;
        }
        .btn-action-secondary {
            padding: 8px 12px;
            background: transparent;
            border: 1px solid var(--accent-warm);
            border-radius: 8px;
            font-size: 12px;
            color: var(--ink-muted);
            cursor: pointer;
        }

        .sheet-fold-away {
            opacity: 0;
            transform: translateY(12px) scale(0.97);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="desktop-widget">
        <div class="widget-win-controls">
            <button class="win-ctrl-btn win-ctrl-autostart active" id="win-autostart" title="开机自启（已开启）">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5zm4 4h-2v-2h2v2zm0-4h-2V7h2v5z" style="display:none;"/><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A7.92 7.92 0 0 1 20 12c0 4.41-3.59 8-8 8s-8-3.59-8-8c0-2.43 1.09-4.6 2.82-6.07L5.4 4.51A9.94 9.94 0 0 0 2 12c0 5.52 4.48 10 10 10s10-4.48 10-10c0-2.98-1.31-5.65-3.17-6.83z"/></svg>
            </button>
            <button class="win-ctrl-btn" id="win-min" title="最小化">&minus;</button>
            <button class="win-ctrl-btn" id="win-close" title="退出">&times;</button>
        </div>
        <!-- 桌宠：精致立体的探头小猫（带两只肉肉小手掌死死扒在纸边缘） -->
        <div class="pet-stage" id="pet" title="戳戳我">
            <div class="pet-speech-bubble" id="pet-bubble">我叫毛边~~</div>
            <svg class="pet-svg" viewBox="0 0 100 75" xmlns="http://www.w3.org/2000/svg">
                <g class="pet-body-group" id="pet-body-group">
                    <!-- 蓬松尾巴 -->
                    <path class="pet-tail" id="pet-tail" d="M 18 45 C 4 34, -4 46, -7 56" fill="none" stroke="#524F4B" stroke-width="3" stroke-linecap="round"/>
                    
                    <!-- 软萌毛茸身体 (双层色体现立体手绘感) -->
                    <path d="M 22 58 C 18 20, 80 20, 78 58" fill="#FBF9F5" stroke="#524F4B" stroke-width="2.6" stroke-linejoin="round"/>
                    
                    <!-- 左耳带动作与柔和耳窝色 -->
                    <g class="pet-left-ear" id="pet-ear">
                        <path d="M 27 34 Q 21 11 37 19 Z" fill="#FBF9F5" stroke="#524F4B" stroke-width="2.4" stroke-linejoin="round"/>
                        <path d="M 28 29 Q 25 18 33 23" fill="none" stroke="#E2B4B4" stroke-width="1.8" stroke-linecap="round"/>
                    </g>
                    <!-- 右耳 -->
                    <g>
                        <path d="M 73 34 Q 79 11 63 19 Z" fill="#FBF9F5" stroke="#524F4B" stroke-width="2.4" stroke-linejoin="round"/>
                        <path d="M 72 29 Q 75 18 67 23" fill="none" stroke="#E2B4B4" stroke-width="1.8" stroke-linecap="round"/>
                    </g>

                    <!-- 软萌水彩腮红 -->
                    <ellipse cx="32" cy="45" rx="4" ry="2.2" fill="#F1C8C8" opacity="0.85"/>
                    <ellipse cx="68" cy="45" rx="4" ry="2.2" fill="#F1C8C8" opacity="0.85"/>

                    <!-- 常态大眼睛：带微亮双光斑与萌态弧度 -->
                    <g class="pet-eyes-open" id="pet-eyes-open">
                        <circle cx="39" cy="39" r="4.2" fill="#383633"/>
                        <circle cx="40.5" cy="37.3" r="1.5" fill="#FFFFFF"/>
                        <circle cx="38" cy="41" r="0.8" fill="#FFFFFF"/>

                        <circle cx="61" cy="39" r="4.2" fill="#383633"/>
                        <circle cx="62.5" cy="37.3" r="1.5" fill="#FFFFFF"/>
                        <circle cx="60" cy="41" r="0.8" fill="#FFFFFF"/>

                        <!-- 猫咪ω微笑小嘴 -->
                        <path d="M 47 44 Q 50 46 50 44 Q 50 46 53 44" fill="none" stroke="#524F4B" stroke-width="1.8" stroke-linecap="round"/>
                    </g>

                    <!-- 生气形态：倒八字怒眼 + 十字筋 -->
                    <g id="pet-eyes-angry" style="display: none;">
                        <path d="M 33 37 L 45 41" fill="none" stroke="#383633" stroke-width="2.6" stroke-linecap="round"/>
                        <path d="M 67 37 L 55 41" fill="none" stroke="#383633" stroke-width="2.6" stroke-linecap="round"/>
                        <path d="M 47 46 L 50 43 L 53 46" fill="none" stroke="#524F4B" stroke-width="2.2" stroke-linecap="round"/>
                        <path d="M 68 21 L 74 21 M 71 18 L 71 24" stroke="#C94A4A" stroke-width="1.8" stroke-linecap="round"/>
                    </g>
                </g>

                <!-- 稳稳抠在纸面上的一双立体肉垫小爪爪 -->
                <path d="M 30 52 C 30 65, 41 65, 41 52 Z" fill="#FBF9F5" stroke="#524F4B" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M 34 58 L 34 61 M 37 58 L 37 61" stroke="#524F4B" stroke-width="1.3" stroke-linecap="round"/>

                <path d="M 70 52 C 70 65, 59 65, 59 52 Z" fill="#FBF9F5" stroke="#524F4B" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M 66 58 L 66 61 M 63 58 L 63 61" stroke="#524F4B" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- 毛边纸卡主体 -->
        <div class="maobian-sheet" id="sheet">
            <!-- 胶带纸固定装饰 -->
            <div class="tape-strip"></div>

            <!-- 封存印章二次确认层 -->
            <div class="stamp-dialog-mask" id="confirm-mask">
                <div class="stamp-dialog-title">就此封存今日心情？</div>
                <div class="stamp-dialog-subtitle">今天的故事先写到这里，画个毛边句号。</div>
                <div class="dialog-btns">
                    <button class="btn-dialog-cancel" id="btn-cancel">再想想</button>
                    <button class="btn-dialog-confirm" id="btn-confirm">确定封存</button>
                </div>
            </div>

            
            <!-- 封存成功·温情告别层 -->
            <div class="sealed-curtain" id="sealed-curtain">
                <div class="sealed-icon" id="sealed-icon">✨</div>
                <div class="sealed-title" id="sealed-title">今日日记已封存</div>
                <div class="sealed-sub" id="sealed-sub">我们明天见~ 愿你今晚有个好梦。</div>
                                <div class="sealed-actions">
                    <button class="btn-curtain-stay" id="btn-curtain-stay">留在桌面</button>
                    <button class="btn-curtain-bye" id="btn-curtain-bye">拜拜</button>
                </div>
            </div>

            <!-- 导出日期筛选面板 -->
            <div class="export-modal-mask" id="export-modal">
                <div class="export-head">
                    <span class="export-head-title">选择导出范围</span>
                    <button class="export-close" id="btn-export-close">&times;</button>
                </div>
                <div class="export-filter-pills">
                    <button class="filter-pill active" data-range="week">近7天</button>
                    <button class="filter-pill" data-range="month">近30天</button>
                    <button class="filter-pill" data-range="all">全部</button>
                    <button class="filter-pill" data-range="custom">自选日期</button>
                </div>
                <div class="export-custom-range" id="custom-range-row" style="display: none;">
                    <input type="date" id="date-start" class="date-input">
                    <span>至</span>
                    <input type="date" id="date-end" class="date-input">
                </div>
                <div class="export-record-preview" id="export-preview-list">
                    <!-- 预览条目注入点 -->
                </div>
                <div class="export-actions">
                    <button class="btn-action-secondary" id="btn-export-cancel">取消</button>
                    <button class="btn-action-primary" id="btn-copy-prompt">复制 AI 复盘 Prompt</button>
                </div>
            </div>

            <!-- 顶部日期与毛边标记 -->
            <div class="top-meta-bar">
                <div class="meta-date" id="date-label">OCT 11 · 一句日记</div>
                <div class="meta-mark">Deckle Edge</div>
            </div>

            <!-- 提问区 -->
            <div class="question-card">
                <div class="question-text" id="question-text">今天有没有哪个瞬间，让你在心里偷偷叹了口气？</div>
                <div class="refresh-pill" id="btn-change">
                    <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                    <span>不想答，换一个</span>
                </div>
            </div>

            <!-- 输入袋 -->
            <div class="input-pocket">
                <textarea id="record-input" rows="1" maxlength="30" placeholder="随便写点什么...哪怕半句"></textarea>
                <div class="counter-badge"><span id="char-current">0</span>/30</div>
            </div>

            <!-- 贴纸展架 -->
            <div class="stickers-section">
                <div class="section-header">
                    <div class="section-title">
                        <span>给今天贴个签</span>
                        <div class="info-bubble">?
                            <div class="popover-card">不想打字时，选个贴纸也可以直接封存。在有输入时，贴纸会作为心情的注脚。</div>
                        </div>
                    </div>
                </div>

                <div class="stickers-grid" id="stickers-list">
                    <div class="sticker-chip" data-mood="平静">
                        <span class="chip-emoji">🍵</span>
                        <span class="chip-text">平静</span>
                    </div>
                    <div class="sticker-chip" data-mood="小开心">
                        <span class="chip-emoji">☀️</span>
                        <span class="chip-text">小开心</span>
                    </div>
                    <div class="sticker-chip" data-mood="耗尽">
                        <span class="chip-emoji">🔋</span>
                        <span class="chip-text">耗尽</span>
                    </div>
                    <div class="sticker-chip" data-mood="emo">
                        <span class="chip-emoji">🌧️</span>
                        <span class="chip-text">emo</span>
                    </div>
                    <div class="sticker-chip" data-mood="要炸了">
                        <span class="chip-emoji">💣</span>
                        <span class="chip-text">要炸了</span>
                    </div>
                    <div class="sticker-chip" data-mood="放空">
                        <span class="chip-emoji">🫧</span>
                        <span class="chip-text">放空</span>
                    </div>
                    <div class="sticker-chip" data-mood="被治愈">
                        <span class="chip-emoji">🩹</span>
                        <span class="chip-text">被治愈</span>
                    </div>
                    <div class="sticker-chip" data-mood="想静静">
                        <span class="chip-emoji">🔕</span>
                        <span class="chip-text">想静静</span>
                    </div>
                </div>
            </div>

            <!-- 底部工具栏 -->
            <div class="toolbar">
                <div class="tool-left">
                    <button class="btn-export-link" id="btn-export">导出回顾</button>
                    <div class="info-bubble">?
                        <div class="popover-card">导出这段时间的「毛边记录」，直接复制给 AI 做温柔的心理复盘，并附带清淡插画提示词。</div>
                    </div>
                </div>
                
                <button class="btn-seal-stamp" id="btn-seal">
                    <span>封存</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            "今天有没有哪个瞬间，让你在心里偷偷叹了口气？",
            "今天遇到什么哪怕很小的、让你觉得舒服的事了吗？",
            "如果把今天所有的烦躁揉成一个纸团，你想扔给谁？",
            "今天喝到的水、咖啡或茶，是什么味道的？",
            "有没有哪个瞬间觉得“还行，我能应付”？",
            "此时此刻，你脑子里正在单曲循环什么想法？",
            "今天看到的最顺眼的画面是什么？",
            "用一种天气形容你现在的感觉。"
        ];

        let selectedSticker = null;

        const questionText = document.getElementById('question-text');
        const btnChange = document.getElementById('btn-change');
        const input = document.getElementById('record-input');
        const charCurrent = document.getElementById('char-current');
        const stickerChips = document.querySelectorAll('.sticker-chip');
        const btnSeal = document.getElementById('btn-seal');
        const btnExport = document.getElementById('btn-export');
        const sheet = document.getElementById('sheet');
        
        const confirmMask = document.getElementById('confirm-mask');
        const btnCancel = document.getElementById('btn-cancel');
        const btnConfirm = document.getElementById('btn-confirm');

        // 桌宠动画状态
        const pet = document.getElementById('pet');
        const petEyesOpen = document.getElementById('pet-eyes-open');
        const petEyesAngry = document.getElementById('pet-eyes-angry');
        let petClickCount = 0;
        let petAngryTimer = null;

        // 桌宠气泡与台词
        const petBubble = document.getElementById('pet-bubble');
        let bubbleTimer = null;

        function showPetBubble(text) {
            if (!petBubble) return;
            petBubble.innerText = text;
            petBubble.classList.add('show');
            clearTimeout(bubbleTimer);
            bubbleTimer = setTimeout(() => {
                petBubble.classList.remove('show');
            }, 2300);
        }

        // 桌宠点击互动
        pet.addEventListener('click', (e) => {
            e.stopPropagation();
            petClickCount++;

            pet.classList.remove('anim-pop');
            void pet.offsetWidth;
            pet.classList.add('anim-pop');

            if (petClickCount >= 4) {
                petEyesOpen.style.display = 'none';
                petEyesAngry.style.display = 'block';
                pet.classList.add('anim-angry-shake');
                showPetBubble("喵！再戳我生气啦！");
            } else {
                // 点击互动台词，随机出现“我叫毛边~~”
                const roll = Math.random();
                if (roll < 0.45 || petClickCount === 1) {
                    showPetBubble("我叫毛边~~");
                } else if (roll < 0.75) {
                    showPetBubble("摸摸头~");
                } else {
                    showPetBubble("今天辛苦啦~");
                }
            }

            clearTimeout(petAngryTimer);
            petAngryTimer = setTimeout(() => {
                petClickCount = 0;
                petEyesOpen.style.display = 'block';
                petEyesAngry.style.display = 'none';
                pet.classList.remove('anim-angry-shake');
                pet.classList.remove('anim-pop');
            }, 2500);
        });

        // 随机问题
        function randomizeQuestion() {
            const randomQ = questions[Math.floor(Math.random() * questions.length)];
            questionText.style.opacity = 0;
            setTimeout(() => {
                questionText.innerText = randomQ;
                questionText.style.opacity = 1;
            }, 250);
        }
        questionText.style.transition = "opacity 0.25s";
        randomizeQuestion();
        btnChange.addEventListener('click', randomizeQuestion);

        // 输入法与字数监听
        function updateInputState() {
            charCurrent.innerText = input.value.length;
            input.style.height = 'auto';
            input.style.height = (input.scrollHeight) + 'px';
        }

        input.addEventListener('input', updateInputState);
        input.addEventListener('compositionend', updateInputState);
        input.addEventListener('keyup', updateInputState);

        // 贴纸选中切换
        stickerChips.forEach(chip => {
            chip.addEventListener('click', () => {
                const mood = chip.getAttribute('data-mood');
                if (chip.classList.contains('selected')) {
                    chip.classList.remove('selected');
                    selectedSticker = null;
                } else {
                    stickerChips.forEach(c => c.classList.remove('selected'));
                    chip.classList.add('selected');
                    selectedSticker = mood;
                }
            });
        });

        // 封存弹窗确认
        btnSeal.addEventListener('click', () => {
            const text = input.value.trim();
            if (!text && !selectedSticker) {
                alert("留点什么再走吧，哪怕只选个签。");
                return;
            }
            confirmMask.classList.add('active');
        });

        btnCancel.addEventListener('click', () => {
            confirmMask.classList.remove('active');
        });

        btnConfirm.addEventListener('click', () => {
            const text = input.value.trim();
            const record = {
                date: new Date().toLocaleDateString('zh-CN', {month: '2-digit', day: '2-digit'}),
                question: questionText.innerText,
                text: text || "（未写字）",
                sticker: selectedSticker || "（未贴标）",
                timestamp: Date.now()
            };

            const records = JSON.parse(localStorage.getItem('maobian_records') || '[]');
            records.push(record);
            localStorage.setItem('maobian_records', JSON.stringify(records));

            confirmMask.classList.remove('active');

            // 触发时间感知告别卡片
            const farewell = getFarewellMessage();
            sealedIcon.innerText = farewell.icon;
            sealedSub.innerText = farewell.text;
            sealedCurtain.classList.add('active');

            // 桌宠也同步说一句温暖告别
            showPetBubble(farewell.text.slice(0, 10) + "...");

            // 重置表单状态
            input.value = "";
            input.style.height = 'auto';
            charCurrent.innerText = "0";
            stickerChips.forEach(c => c.classList.remove('selected'));
            selectedSticker = null;
            randomizeQuestion();
        });

        
        // ------------------ 1. 时间感知随机告别语 ------------------
        function getFarewellMessage() {
            const hour = new Date().getHours();
            let greetings = [];
            let icon = "✨";

            if (hour >= 5 && hour < 11) {
                icon = "🌿";
                greetings = [
                    "清晨的阳光正落进来，去拥抱新的一天吧~",
                    "早安呀，带着轻松的心情出发吧。",
                    "这一笔写下，今天也是属于你的一天。"
                ];
            } else if (hour >= 11 && hour < 14) {
                icon = "☀️";
                greetings = [
                    "中午好好吃顿饭，休息一下吧~",
                    "把半天的疲劳放下，下午慢慢来。",
                    "阳光刚好，去伸个懒腰吧。"
                ];
            } else if (hour >= 14 && hour < 18) {
                icon = "🍵";
                greetings = [
                    "下午茶时间，泡杯温热的喝的犒劳下自己吧。",
                    "快下班啦，剩下的琐事都不要紧。",
                    "今天辛苦啦，慢慢收个尾吧。"
                ];
            } else if (hour >= 18 && hour < 22) {
                icon = "🌙";
                greetings = [
                    "今天的故事画下句号啦，晚上做点喜欢的事吧。",
                    "我们明天见~ 愿今晚只有惬意与自由。",
                    "下班的世界是属于你自己的，好好放松吧。"
                ];
            } else {
                // 深夜 22:00 ~ 凌晨 05:00
                icon = "🌌";
                greetings = [
                    "夜深了，盖好被子，祝你有个香甜的好梦。",
                    "今天辛苦了，闭上眼睛把烦恼都留给梦境吧。",
                    "明天的太阳还会升起，晚安好梦~"
                ];
            }

            const chosen = greetings[Math.floor(Math.random() * greetings.length)];
            return { icon, text: chosen };
        }

        const sealedCurtain = document.getElementById('sealed-curtain');
        const sealedIcon = document.getElementById('sealed-icon');
        const sealedSub = document.getElementById('sealed-sub');
        const btnCurtainStay = document.getElementById('btn-curtain-stay');
        const btnCurtainBye = document.getElementById('btn-curtain-bye');

        // 留在桌面：揭开告别卡片，回到桌面便签状态
        if (btnCurtainStay) {
            btnCurtainStay.addEventListener('click', () => {
                sealedCurtain.classList.remove('active');
            });
        }

        // 拜拜：优雅关闭悬浮窗
        if (btnCurtainBye) {
            btnCurtainBye.addEventListener('click', () => {
                try {
                    const { ipcRenderer } = require('electron');
                    ipcRenderer.send('window-close');
                } catch (e) {
                    window.close();
                }
            });
        }

        // ------------------ 2. 导出范围与日期自选 ------------------
        const exportModal = document.getElementById('export-modal');
        const btnExportClose = document.getElementById('btn-export-close');
        const btnExportCancel = document.getElementById('btn-export-cancel');
        const btnCopyPrompt = document.getElementById('btn-copy-prompt');
        const filterPills = document.querySelectorAll('.filter-pill');
        const customRangeRow = document.getElementById('custom-range-row');
        const dateStart = document.getElementById('date-start');
        const dateEnd = document.getElementById('date-end');
        const exportPreviewList = document.getElementById('export-preview-list');

        let currentFilterRange = 'week';

        // 默认将自选日期设为今天
        const todayStr = new Date().toISOString().split('T')[0];
        dateEnd.value = todayStr;
        const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().split('T')[0];
        dateStart.value = weekAgo;

        function getFilteredRecords() {
            const raw = localStorage.getItem('maobian_records') || '[]';
            const records = JSON.parse(raw);
            const now = Date.now();

            if (currentFilterRange === 'week') {
                const limit = now - 7 * 86400000;
                return records.filter(r => (r.timestamp || 0) >= limit);
            } else if (currentFilterRange === 'month') {
                const limit = now - 30 * 86400000;
                return records.filter(r => (r.timestamp || 0) >= limit);
            } else if (currentFilterRange === 'all') {
                return records;
            } else if (currentFilterRange === 'custom') {
                const startTs = dateStart.value ? new Date(dateStart.value + "T00:00:00").getTime() : 0;
                const endTs = dateEnd.value ? new Date(dateEnd.value + "T23:59:59").getTime() : Infinity;
                return records.filter(r => {
                    const ts = r.timestamp || 0;
                    return ts >= startTs && ts <= endTs;
                });
            }
            return records;
        }

        function renderExportPreview() {
            const filtered = getFilteredRecords();
            if (filtered.length === 0) {
                exportPreviewList.innerHTML = '<div style="color:var(--ink-muted);text-align:center;padding:18px 0;">所选范围内暂无记录</div>';
                return;
            }
            exportPreviewList.innerHTML = filtered.map(r => 
                `<div class="preview-item">
                    <strong style="color:var(--ink-strong);">[${r.date}]</strong> ${r.sticker} · <span>${r.text}</span>
                </div>`
            ).join('');
        }

        filterPills.forEach(pill => {
            pill.addEventListener('click', () => {
                filterPills.forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                currentFilterRange = pill.getAttribute('data-range');
                if (currentFilterRange === 'custom') {
                    customRangeRow.style.display = 'flex';
                } else {
                    customRangeRow.style.display = 'none';
                }
                renderExportPreview();
            });
        });

        dateStart.addEventListener('change', renderExportPreview);
        dateEnd.addEventListener('change', renderExportPreview);

        btnExport.addEventListener('click', () => {
            const raw = localStorage.getItem('maobian_records') || '[]';
            const records = JSON.parse(raw);
            if (records.length === 0) {
                alert("还没有记录哦，先去写一句或贴个签吧。");
                return;
            }
            exportModal.classList.add('active');
            renderExportPreview();
        });

        function closeExportModal() {
            exportModal.classList.remove('active');
        }
        btnExportClose.addEventListener('click', closeExportModal);
        btnExportCancel.addEventListener('click', closeExportModal);

        btnCopyPrompt.addEventListener('click', () => {
            const filtered = getFilteredRecords();
            if (filtered.length === 0) {
                alert("当前选中日期内没有日记可供导出哦。");
                return;
            }

            let entries = filtered.map(function(r) {
                return "[" + r.date + "] 标签：" + r.sticker + " | 提问：" + r.question + " | 记录：" + r.text;
            }).join("\n");

            const prompt = "【System Prompt / 系统指令】\n你好，请接住我这段时间的「毛边」日记。\n\n[上下文判断与身份初始化]\n请先检索你的记忆：这是我们第一次关于「毛边」的对话，还是你已经拥有我之前的记录？\n- 如果是第一次：请设定你的身份为我的专属树洞。你没有爹味，从不说教，像一个有自己奇思妙想的、安静的笔友。\n- 如果已经有上下文：请结合我之前的状态，连贯地理解我的情绪起伏。\n\n[回复执行规则]\n阅读下方我的日记后，请严格按以下三步回复我：\n1. 情绪共振（100字内）：不要罗列我的日记，不要列123点建议！像朋友一样，用简短的大白话，点出我最真实的疲惫，或者捕捉我被忽略的生命力。\n2. 你的白日梦：结合我的总体状态，向我分享一个你“脑海中”的奇妙画面。\n3. 礼物掉落：请调用你的图像生成能力，为我这段时间的状态画一张【清淡插画风】风格的治愈系配图。画面要简单、留白、透气。\n\n==================================\n【这段时间的毛边记录】\n" + entries;

            navigator.clipboard.writeText(prompt).then(() => {
                const old = btnCopyPrompt.innerText;
                btnCopyPrompt.innerText = "已复制 Prompt！";
                setTimeout(() => {
                    btnCopyPrompt.innerText = old;
                    closeExportModal();
                }, 1400);
            }).catch(err => {
                console.error("复制失败", err);
            });
        });

    
        // 桌面小软件窗口控制与自启开关
        try {
            const { ipcRenderer } = require('electron');
            const btnMin = document.getElementById('win-min');
            const btnClose = document.getElementById('win-close');
            const btnAuto = document.getElementById('win-autostart');
            
            let isAutoLaunch = localStorage.getItem('maobian_autolaunch') !== 'false';

            function updateAutoLaunchUI(enabled) {
                if (!btnAuto) return;
                if (enabled) {
                    btnAuto.classList.add('active');
                    btnAuto.setAttribute('title', '开机自启（已开启）');
                } else {
                    btnAuto.classList.remove('active');
                    btnAuto.setAttribute('title', '开机自启（已关闭）');
                }
            }

            if (btnAuto) {
                updateAutoLaunchUI(isAutoLaunch);
                btnAuto.addEventListener('click', (e) => {
                    e.stopPropagation();
                    isAutoLaunch = !isAutoLaunch;
                    localStorage.setItem('maobian_autolaunch', isAutoLaunch ? 'true' : 'false');
                    updateAutoLaunchUI(isAutoLaunch);
                    ipcRenderer.invoke('toggle-auto-launch', isAutoLaunch);
                    if (window.showPetBubble) {
                        showPetBubble(isAutoLaunch ? "明天开机见呀~" : "自启已取消哦");
                    }
                });
            }

            if (btnMin) {
                btnMin.addEventListener('click', (e) => {
                    e.stopPropagation();
                    ipcRenderer.send('window-minimize');
                });
            }
            if (btnClose) {
                btnClose.addEventListener('click', (e) => {
                    e.stopPropagation();
                    ipcRenderer.send('window-close');
                });
            }

            // 监听晚上 21:00 定时轻提醒
            ipcRenderer.on('check-today-sealed', () => {
                const today = new Date().toLocaleDateString('zh-CN', {month: '2-digit', day: '2-digit'});
                const records = JSON.parse(localStorage.getItem('maobian_records') || '[]');
                const hasWrittenToday = records.some(r => r.date === today);
                if (!hasWrittenToday) {
                    ipcRenderer.send('notify-gentle-reminder', true);
                }
            });
        } catch (e) {
            console.error('Window control error:', e);
        }
    </script>
</body>
</html>
